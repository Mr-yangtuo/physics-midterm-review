<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">空气薄膜空气的实际折射几何，入射角30度膜内19.47度</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#176f68"/></marker></defs><rect width="640" height="300" rx="14" fill="#f4f8f6"/><g font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#233c42" stroke-width="1.4"><rect x="35" y="100" width="570" height="90" fill="#cce4df"/><line x1="35" y1="100" x2="605" y2="100" stroke="#176f68" /><line x1="35" y1="190" x2="605" y2="190" stroke="#176f68" /><line x1="200" y1="25" x2="200" y2="250" stroke="#8ca2a2" stroke-dasharray="5 5"/><line x1="150" y1="13.397" x2="200" y2="100" stroke="#176f68" marker-end="url(#arrow)"/><line x1="200" y1="100" x2="250" y2="13.397" stroke="#176f68" marker-end="url(#arrow)"/><line x1="200" y1="100" x2="231.81980515339464" y2="190" stroke="#cf713c" /><line x1="231.81980515339464" y1="190" x2="263.6396103067893" y2="100" stroke="#cf713c" /><line x1="263.6396103067893" y1="100" x2="313.6396103067893" y2="13.397" stroke="#176f68" marker-end="url(#arrow)"/><text x="375" y="65" >空气 n₀ = 1</text><text x="375" y="150" >薄膜 n = 1.5</text><text x="375" y="225" >空气 nₛ = 1</text><text x="66" y="60" >i = 30°</text><text x="66" y="150" >r ≈ 19.47°</text><text x="65" y="270" >上界面反射反相，下界面反射不反相</text><line x1="560" y1="100" x2="560" y2="190" stroke="#8ca2a2" /><text x="570" y="150" >e</text></g></svg>