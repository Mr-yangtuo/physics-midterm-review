<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">牛顿暗环半径按级次平方根生成，中心暗且外侧环更密</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#176f68"/></marker></defs><rect width="640" height="300" rx="14" fill="#f4f8f6"/><g font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#233c42" stroke-width="1.4"><circle cx="168" cy="143" r="3" fill="#233c42"/><circle cx="168" cy="143" r="43" fill="none" stroke="#176f68" stroke-width="2"/><circle cx="168" cy="143" r="60.81118318204309" fill="none" stroke="#176f68" stroke-width="2"/><circle cx="168" cy="143" r="74.47818472546172" fill="none" stroke="#176f68" stroke-width="2"/><circle cx="168" cy="143" r="86" fill="none" stroke="#176f68" stroke-width="2"/><circle cx="168" cy="143" r="96.15092303249097" fill="none" stroke="#176f68" stroke-width="2"/><circle cx="168" cy="143" r="105.32805893967665" fill="none" stroke="#176f68" stroke-width="2"/><text x="68" y="275" >暗环：rₘ ∝ √m</text><text x="340" y="64" >反射观察，中心接触</text><text x="340" y="104" >中心为暗点（m = 0）</text><text x="340" y="145" >越向外，相邻暗环越密</text><text x="340" y="188" >同级暗环：rₘ² = mλR/n</text><text x="340" y="231" >图中仅标暗环中心线</text></g></svg>